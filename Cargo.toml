[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/cli", "crates/worker", "crates/server"]
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pdfq-core = { path = "crates/core" }
pdfq-protocol = { path = "crates/protocol" }
# Typst is pinned exactly: document compatibility is part of the PDFQ contract.
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
anyhow = "1"
async-channel = "2"
libc = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_bytes = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tempfile = "3"

[workspace.lints.rust]
# Denied by default; only the worker and the process spawner opt out, locally.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
