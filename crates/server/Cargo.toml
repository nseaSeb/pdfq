[package]
name = "pdfq-server"
description = "PDFQ HTTP server and worker pool supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pdfq"
path = "src/main.rs"

[dependencies]
pdfq-protocol = { workspace = true, features = ["tokio"] }
async-channel.workspace = true
libc.workspace = true
tokio.workspace = true
tracing.workspace = true
axum = { version = "0.8.9", features = ["multipart"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
imagesize = "0.15.0"
jsonschema = { version = "0.60.2", default-features = false }
uuid = { version = "1.29.1", features = ["v4"] }
hmac = "0.13.0"
sha2 = "0.11.1"
bytes = "1.12.1"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
time = { workspace = true, features = ["formatting"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
